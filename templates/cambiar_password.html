{% extends "base.html" %}
{% block titulo %}Cambiar contraseña{% endblock %}
{% block contenido %}
<h1>Cambiar mi contraseña</h1>
{% if forzado %}
<p class="nota">Tenés que elegir una contraseña propia para poder seguir usando la app.</p>
{% endif %}
<form method="post" class="form-password">
  {% if not forzado %}
  <label>Contraseña actual <input type="password" name="actual" required></label>
  {% endif %}
  <label>Contraseña nueva <input type="password" name="nueva" required minlength="6"></label>
  <label>Confirmar contraseña nueva <input type="password" name="confirmar" required minlength="6"></label>
  <button type="submit" class="btn-principal">Guardar</button>
</form>
{% endblock %}
