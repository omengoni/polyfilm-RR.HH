<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>RR.HH. Polyfilm - Restablecer contraseña</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">
<div class="login-box">
  <h1>Elegir contraseña nueva</h1>
  {% with mensajes = get_flashed_messages(with_categories=true) %}
    {% if mensajes %}
      <div class="flashes">
        {% for categoria, msg in mensajes %}
          <div class="flash flash-{{ categoria }}">{{ msg }}</div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}
  <form method="post">
    <label>Contraseña nueva <input type="password" name="nueva" required minlength="6"></label>
    <label>Confirmar contraseña nueva <input type="password" name="confirmar" required minlength="6"></label>
    <button type="submit" class="btn-principal">Guardar</button>
  </form>
</div>
</body>
</html>
